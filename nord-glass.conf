# Nord Glass — settings. Edit, then run ./install.sh again (it is idempotent).
# Bash syntax. Every value has a sane default; delete a line to fall back to it.

# ── Blur (Better Blur DX if installed, otherwise the stock KWin blur) ─────────────────────────
BLUR_STRENGTH=3          # 1–15. Low = you can still read what is behind a window. 15 = frosted.
REFRACTION=4             # 0–20 (Better Blur DX only). Light bending at window edges. 0 = off.
CORNER_RADIUS=14         # px, should match your window decoration

# ── Kvantum (Qt/KDE apps) ─────────────────────────────────────────────────────────────────────
KVANTUM_WINDOW_OPACITY=50   # 0–100, how much Kvantum reduces window background opacity
KVANTUM_MENU_OPACITY=30     # same for menus and popups

# ── Glow around the active window (Breeze decoration only) ────────────────────────────────────
GLOW_COLOR="136,192,208"  # Nord Frost (nord8). R,G,B
GLOW_STRENGTH=70          # 0–255. 70 = subtle shimmer, 200+ = neon
GLOW_SIZE=ShadowSmall     # ShadowNone | ShadowSmall | ShadowMedium | ShadowLarge | ShadowVeryLarge

# ── Per-app transparency (KWin window rules) ──────────────────────────────────────────────────
# Format: "window-class:active%:inactive%". Rules for apps you don't have are harmless.
# Find a class: Alt+F3 → More Actions → Configure Special Window Settings → Detect Window Properties.
APPS=(
  "firefox:88:78"
  "brave-browser:88:78"
  "chromium:88:78"
  "google-chrome:88:78"
  "org.kde.dolphin:90:80"
  "org.kde.kate:90:80"
  "org.kde.konsole:88:78"
  "org.kde.haruna:70:60"
  "org.kde.plasma-systemmonitor:85:75"
  "org.kde.systemsettings:92:85"
  "code:92:85"
  "steam:88:78"
)

# Apps that draw their own transparency (kitty) get blur but no opacity rule,
# otherwise the two transparencies multiply.
BLUR_ONLY=(kitty Alacritty org.wezfurlong.wezterm)

# ── kitty ─────────────────────────────────────────────────────────────────────────────────────
KITTY_OPACITY=0.42        # 0.0–1.0
