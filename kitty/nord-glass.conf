# Nord Glass for kitty — https://github.com/ChristianGruend/nord-glass-kde
# Nord palette (https://www.nordtheme.com) with a deep cyan-tinted background instead of Nord grey:
# at low opacity grey turns milky, the cyan tint stays clear.
# Included at the end of kitty.conf by install.sh (`include nord-glass.conf`).

foreground              #D8DEE9
background              #0F1C23
selection_foreground    #2E3440
selection_background    #88C0D0
cursor                  #D8DEE9
cursor_text_color       #2E3440
url_color               #88C0D0

active_border_color     #88C0D0
inactive_border_color   #4C566A
bell_border_color       #EBCB8B

active_tab_foreground   #2E3440
active_tab_background   #88C0D0
inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252
tab_bar_background      #0F1C23

# normal
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0
# bright
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# Glass: kitty draws its own transparency; background_blur asks KWin for blur behind it
# (works with the stock KWin blur too, no Better Blur DX needed).
background_opacity 0.42
background_blur 1
